{% extends "base.html" %}
{% block title %}Extract · Manifiesto ETL{% endblock %}
{% set stage = 'extract' %}

{% block content %}

<div class="waybill-row">
  <div class="waybill tone-total">
    <div class="wb-label">Registros leídos</div>
    <div class="wb-value">{{ total }}</div>
    <div class="wb-barcode"></div>
  </div>
</div>

<div class="panel">
  <div class="panel-head">
    <div>
      <p class="eyebrow">Paso 01 completado</p>
      <h2>Vista previa del archivo</h2>
    </div>
    <div class="meta">{{ total }} filas</div>
  </div>

  <div class="table-wrap">
    {{ tabla | safe }}
  </div>

  <div class="actions-row">
    <a href="/" class="btn btn-ghost">Cargar otro archivo</a>
    <form action="/transform" method="post">
      <button type="submit" class="btn">
        Ejecutar Transform
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>
</div>

{% endblock %}
