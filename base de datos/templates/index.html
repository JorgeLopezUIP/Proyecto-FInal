{% extends "base.html" %}
{% block title %}Cargar archivo · Manifiesto ETL{% endblock %}
{% set stage = 'extract' %}

{% block content %}

<div class="panel">
  <div class="panel-head">
    <div>
      <p class="eyebrow">Paso 01 — Extract</p>
      <h2>Selecciona el archivo de origen</h2>
    </div>
    <div class="meta">.xlsx</div>
  </div>

  <form id="upload-form" action="/extract" method="post" enctype="multipart/form-data">
    <label class="dropzone" id="dropzone" for="archivo">
      <div class="dropzone-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h3>Arrastra tu archivo Excel aquí</h3>
      <p>o haz clic para buscarlo — formato .xlsx</p>
      <input type="file" name="archivo" id="archivo" accept=".xlsx,.xls">

      <div id="file-chip">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="name" id="file-name"></span>
      </div>
    </label>

    <div class="actions-row">
      <button type="submit" class="btn" id="submit-btn" disabled>
        Ejecutar Extract
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </form>
</div>

<script>
  const dz = document.getElementById('dropzone');
  const input = document.getElementById('archivo');
  const chip = document.getElementById('file-chip');
  const nameEl = document.getElementById('file-name');
  const btn = document.getElementById('submit-btn');

  function showFile(file){
    if(!file) return;
    nameEl.textContent = file.name;
    chip.style.display = 'flex';
    btn.disabled = false;
  }

  input.addEventListener('change', () => showFile(input.files[0]));

  ['dragenter','dragover'].forEach(evt =>
    dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.add('is-drag'); })
  );
  ['dragleave','drop'].forEach(evt =>
    dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.remove('is-drag'); })
  );
  dz.addEventListener('drop', e => {
    if(e.dataTransfer.files.length){
      input.files = e.dataTransfer.files;
      showFile(input.files[0]);
    }
  });
</script>

{% endblock %}
