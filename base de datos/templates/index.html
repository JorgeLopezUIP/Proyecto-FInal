<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Sistema ETL</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <h1>Sistema ETL</h1>

        <p>
            Cargar, transformar y almacenar datos
        </p>


        <form
            action="/extract"
            method="POST"
            enctype="multipart/form-data"
        >

            <label>
                Seleccione un archivo Excel:
            </label>

            <input
                type="file"
                name="archivo"
                accept=".xlsx,.xls"
                required
            >

            <button type="submit">
                Procesar archivo
            </button>

        </form>

    </div>

</body>

</html>
