{% extends "base.html" %}
{% block title %}Error · Manifiesto ETL{% endblock %}
{% set stage = stage_hint if stage_hint else 'extract' %}

{% block content %}

<div class="panel">
  <div class="state-block">
    <div class="code">{{ codigo if codigo else "ERROR" }}</div>
    <h2>{{ titulo if titulo else "Algo salió mal" }}</h2>
    <p>{{ mensaje }}</p>
    <a href="/" class="btn">Volver al inicio</a>
  </div>
</div>

{% endblock %}
